<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>GOTY Vote 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              /* Gala: palco preto, ouro escovado, marfim */
              ink: '#0b0b0c',
              velvet: '#141312',
              'velvet-line': '#2a2620',
              gold: { DEFAULT: '#c9a24a', bright: '#f0d58a', dim: '#7a5c22' },
              burgundy: { DEFAULT: '#a3302a', bright: '#f08a7e' },
              paper: '#f4f1ea',
              ash: '#a49d8e',
            },
            fontFamily: {
              display: ['Archivo', 'sans-serif'],
              mono: ['Archivo', 'sans-serif'],
              sans: ['Archivo', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      ::selection { background: rgba(201, 162, 74, 0.4); color: #f4f1ea; }
      input { caret-color: #c9a24a; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0b0b0c; }
      ::-webkit-scrollbar-thumb { background: #2a2620; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #7a5c22; }
      * { scrollbar-width: thin; scrollbar-color: #2a2620 #0b0b0c; }

      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid #c9a24a;
        outline-offset: 3px;
        border-radius: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        font-family: 'Archivo', sans-serif;
        background: #0b0b0c;
        position: relative;
      }
      /* Holofote quente vindo do topo do palco */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 55% at 50% -8%, rgba(201, 162, 74, 0.16), transparent 70%),
          radial-gradient(ellipse 35% 40% at 50% -5%, rgba(240, 213, 138, 0.10), transparent 70%);
        pointer-events: none;
      }

      /* Display: Archivo larga e pesada */
      .font-display { font-stretch: 112%; font-weight: 800; letter-spacing: -0.01em; }
      .font-mono { font-variant-numeric: tabular-nums; }
      .text-shadow-gold { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }

      /* Ouro escovado para números e títulos de destaque (preenchimento sólido, sem gradiente no texto) */
      .gold-rule { background: linear-gradient(90deg, transparent, #c9a24a 20%, #f0d58a 50%, #c9a24a 80%, transparent); height: 1px; }

      /* Entrada do holofote: o troféu acende */
      @keyframes spotlight {
        from { opacity: 0; filter: brightness(0.3) blur(2px); transform: translateY(8px); }
        to { opacity: 1; filter: brightness(1) blur(0); transform: none; }
      }
      .animate-spotlight { animation: spotlight 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in { animation: scale-in 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
</head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
