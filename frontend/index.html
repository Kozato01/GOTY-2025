<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TGA 2026 GOAT Vote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #07030f 0%, #100720 50%, #07030f 100%);
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          repeating-linear-gradient(45deg, transparent, transparent 50px, rgba(139, 92, 246, 0.04) 50px, rgba(139, 92, 246, 0.04) 51px),
          repeating-linear-gradient(-45deg, transparent, transparent 50px, rgba(245, 158, 11, 0.02) 50px, rgba(245, 158, 11, 0.02) 51px);
        pointer-events: none;
      }
      .text-shadow-sky {
        text-shadow: 0 0 20px rgba(139, 92, 246, 0.9), 0 0 40px rgba(245, 158, 11, 0.4);
      }
      .text-shadow-gold {
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 165, 0, 0.4);
      }
      
      /* Animação Pop-in para as imagens */
      @keyframes pop-in {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        70% {
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .pop-in {
        animation: pop-in 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      
      /* Animação Scale-in para o checkmark */
      @keyframes scale-in {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .animate-scale-in {
        animation: scale-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      
      /* Animação Fade-in */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out;
      }
      
      /* Truncate text */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
